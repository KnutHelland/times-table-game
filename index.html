<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Times Tables</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#2f6fdf">
</head>
<body>
  <header>
    <h1 data-i18n="title"></h1>
    <div class="header-buttons">
      <button id="open-profiles" class="icon-button avatar-button" hidden><img id="profile-avatar" class="avatar" alt=""></button>
      <button id="open-settings" class="icon-button" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <button id="update-banner" class="update-banner" data-i18n="updateReady" hidden></button>
    <button id="install-button" class="install-button" data-i18n="installApp" hidden></button>
    <section id="menu" class="screen">
      <nav class="tabs">
        <button data-tab="levels" data-i18n="levels"></button>
        <button data-tab="free" data-i18n="freePlay"></button>
      </nav>

      <div id="tab-levels">
        <p id="medal-summary" class="medal-summary"></p>
        <div id="level-map"></div>
      </div>

      <div id="tab-free" hidden>
        <h2 data-i18n="tables"></h2>
        <div id="table-chips" class="chips"></div>
        <p id="table-warning" class="warning" data-i18n="selectOne" hidden></p>

        <h2 data-i18n="mode"></h2>
        <div id="modes" class="modes"></div>
      </div>
    </section>

    <section id="settings" class="screen" hidden>
      <button id="close-settings" class="link" data-i18n="back"></button>
      <h2 data-i18n="settings"></h2>
      <h3 data-i18n="language"></h3>
      <div id="languages"></div>
      <h3 data-i18n="tables"></h3>
      <label class="check">
        <input type="checkbox" id="include-11-12">
        <span data-i18n="include1112"></span>
      </label>
      <p class="small" data-i18n="include1112Help"></p>
      <p class="small credits" data-i18n="avatarCredits"></p>
    </section>

    <section id="profiles" class="screen" hidden></section>
    <section id="new-profile" class="screen" hidden></section>
    <section id="rename-profile" class="screen" hidden></section>
    <section id="delete-profile" class="screen" hidden></section>

    <section id="intro" class="screen" hidden></section>

    <section id="play" class="screen" hidden>
      <div class="play-top">
        <button id="quit" class="link" data-i18n="quit"></button>
        <span id="medal-track" class="medal-track"></span>
        <span id="clock"></span>
      </div>
      <div class="bar set-bar"><div id="set-progress"></div></div>
      <p id="set-label" class="small"></p>
      <div id="stage" class="stage"></div>
    </section>

    <section id="result" class="screen" hidden></section>
  </main>

  <script src="i18n.js"></script>
  <script src="lang/en.js"></script>
  <script src="lang/no.js"></script>
  <script src="lang/nn.js"></script>
  <script src="lang/sv.js"></script>
  <script src="lang/da.js"></script>
  <script src="lang/de.js"></script>
  <script src="lang/fr.js"></script>
  <script src="lang/es.js"></script>
  <script src="core.js"></script>
  <script src="levels.js"></script>
  <script src="games.js"></script>
  <script src="profiles.js"></script>
  <script src="app.js"></script>
</body>
</html>
